name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Compiled scripts are up to date
        run: npm run build && git diff --exit-code skills/wrel-weather/scripts
      - name: Validate
        run: npm run validate
      - name: Tests
        run: npm test
      - name: Demo
        run: npm run demo
      - name: Package the skill
        run: npm run package
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: wrel-weather
          path: |
            dist/wrel-weather.zip
            wrel/
